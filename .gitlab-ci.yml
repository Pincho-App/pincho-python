# GitLab CI configuration for Pincho Python SDK
#
# Triggers:
#   - Push to any branch: Runs lint, test, and build
#   - Push tag v*.*.*: Runs full pipeline including PyPI publish and notification
#
# Required CI/CD variables:
#   - PYPI_TOKEN: PyPI API token for publishing (protected)
#   - PINCHO_TOKEN: Pincho API token for notifications

stages:
  - lint
  - test
  - build
  - publish
  - notify

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip"

# Cache pip downloads across jobs
.pip-cache: &pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip/
    policy: pull-push

# Default Python image
default:
  image: python:3.11

# =============================================================================
# LINT STAGE
# =============================================================================

lint:black:
  stage: lint
  <<: *pip-cache
  script:
    - echo "=== Checking code formatting with black ==="
    - pip install black>=23.0.0
    - black --check src/ tests/
    - echo "Code formatting check passed"

lint:ruff:
  stage: lint
  <<: *pip-cache
  script:
    - echo "=== Running linting with ruff ==="
    - pip install ruff>=0.1.0
    - ruff check src/ tests/
    - echo "Linting passed"

lint:mypy:
  stage: lint
  <<: *pip-cache
  script:
    - echo "=== Running type checking with mypy ==="
    - pip install -e ".[dev]"
    - mypy src/pincho
    - echo "Type checking passed"

# =============================================================================
# TEST STAGE
# =============================================================================

test:
  stage: test
  <<: *pip-cache
  script:
    - echo "=== Installing dependencies ==="
    - pip install -e ".[dev]"
    - echo "=== Running tests with coverage ==="
    - pytest --cov=pincho --cov-report=term-missing --cov-report=xml -v
    - echo ""
    - echo "=== Checking coverage threshold ==="
    - coverage report --fail-under=85
    - echo "Coverage meets 85% threshold"
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 7 days

# =============================================================================
# BUILD STAGE
# =============================================================================

build:
  stage: build
  <<: *pip-cache
  script:
    - echo "=== Building package ==="
    - pip install build
    - python -m build
    - echo ""
    - echo "=== Built artifacts ==="
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# =============================================================================
# PUBLISH STAGE (tags only)
# =============================================================================

publish:pypi:
  stage: publish
  <<: *pip-cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+)?$/
  script:
    - echo "=== Publishing $CI_COMMIT_TAG to PyPI ==="
    - pip install twine
    - python -m twine upload
        --username __token__
        --password "$PYPI_TOKEN"
        --non-interactive
        dist/*
    - echo "Successfully published $CI_COMMIT_TAG to PyPI!"
  dependencies:
    - build

# =============================================================================
# NOTIFY STAGE (tags only)
# =============================================================================

notify:
  stage: notify
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+)?$/
  script:
    - echo "=== Git tag detected: $CI_COMMIT_TAG ==="
    - echo "=== Sending release notification via NotifAI ==="
    - 'curl -s -X POST https://api.pincho.app/notifai -H "Authorization: Bearer $PINCHO_TOKEN" -H "Content-Type: application/json" -d "{\"text\": \"Pincho Python SDK $CI_COMMIT_TAG published to PyPI. Install via pip install pincho. View at https://pypi.org/project/pincho/\", \"type\": \"release\"}"'
    - echo ""
    - echo "Release notification sent via NotifAI"
  dependencies: []
