# GitHub Actions CI/CD for Pincho Python SDK
#
# Triggers:
#   - Push to main: Runs lint, test, and build
#   - Pull request to main: Runs lint, test, and build
#   - Push tag v*: Runs full pipeline including PyPI publish and notification
#
# Required secrets:
#   - PYPI_TOKEN: PyPI API token for publishing
#   - PINCHO_TOKEN: Pincho API token for notifications

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/pincho

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=pincho --cov-report=term-missing --cov-report=xml -v

      - name: Check coverage threshold
        run: coverage report --fail-under=85

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: List built artifacts
        run: ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        run: |
          python -m twine upload \
            --username __token__ \
            --password "$PYPI_TOKEN" \
            --non-interactive \
            dist/*
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  notify:
    name: Release Notification
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Send release notification via NotifAI
        run: |
          curl -s -X POST https://api.pincho.app/notifai \
            -H "Authorization: Bearer $PINCHO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Pincho Python SDK ${{ github.ref_name }} published to PyPI. Install via pip install pincho-sdk.\", \"type\": \"release\"}"
        env:
          PINCHO_TOKEN: ${{ secrets.PINCHO_TOKEN }}
